<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile-Friendly Dropdown Menu</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="dropdown-menu">

        <!-- hamburger button, only visible on small screens (Claude) -->
        <!-- Each span is a small bar (PL)                    --> 
        <button class="nav-toggle"
            aria-label="Toggle navigation menu" aria-expanded="false">
            <span></span> <span></span> <span></span>
        </button>

         <!-- top bar is a <ul> styled as a dropdown-menu -->
        <ul>
            <!-- the first top bar list item is not a parent -->
            <li><a href="#">Home</a></li>
            
            <!-- the second top bar item is a <li> styled as a dropdown-parent -->
            <li class="dropdown-parent">
            
                <a href="#">Products ▾</a>
                
                <!-- this second level item is itself a <ul> -->
                <ul class="dropdown">
                    <li><a href="#">Laptops</a></li>
                    
                    <!-- this second level header is also a dropdown parent -->
                    <li class="dropdown-parent">
                        <a href="#">Accessories ▸</a>
                        
                        <!-- the second level dropdown menu is a <ul> again -->
                        <!-- it doesn't work if you use a plain dropdown -->
                        <ul class="dropdown-submenu">
                            <li><a href="#">Keyboards</a></li>
                            
                           <li><a href="#">Mice</a></li>
                            
                    <!-- this third level header is also a dropdown parent -->                           <li class="dropdown-parent">
                              <a href="#">Sub-sub ▸</a>
                           <ul class="dropdown-submenu">
                              <li><a href="#">Keyboards</a></li>
                              <li><a href="#">Mice</a></li>
                              <li><a href="#">Headphones</a></li>
                           </ul>
                     </li> <!-- end Accessories -->
                            
                            <li><a href="#">Headphones</a></li>
                        </ul>
                    </li>
                    <li><a href="#">Monitors</a></li>
                </ul>
            </li>  <!-- end "Products" + dropdown -->
            
            <li class="dropdown-parent">
                <a href="#">Services ▾</a>
                
                <ul class="dropdown">
                    <li><a href="#">Consulting</a></li>
                    
                    <li class="dropdown-parent">
                        <a href="#">Support ▸</a>
                        <ul class="dropdown-submenu">
                            <li><a href="#">24/7 Help</a></li>
                            <li><a href="#">Live Chat</a></li>
                        </ul>
                    </li>
                </ul>
            </li>
            
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

    <script>
        const navToggle = document.querySelector('.nav-toggle');
        const menu = document.querySelector('.dropdown-menu > ul');

        // Hamburger button opens/closes the whole menu on small screens
        navToggle.addEventListener('click', () => {
            const isOpen = menu.classList.toggle('open');
            navToggle.classList.toggle('open', isOpen);
            navToggle.setAttribute('aria-expanded', isOpen);
        });

        // Tap-to-open for items that have a submenu (since :hover doesn't
        // work reliably on touch devices). Desktop hover still works via CSS.
        document.querySelectorAll('.dropdown-parent > a').forEach(link => {
            link.addEventListener('click', function (e) {
                const parentLi = this.parentElement;
                const submenu = this.nextElementSibling;
                if (!submenu) return;

                // Only intercept the click on touch/mobile-width screens;
                // on desktop, let hover handle it and allow normal clicks.
                if (window.matchMedia('(hover: none), (max-width: 768px)').matches) {
                    e.preventDefault();
                    const isOpen = parentLi.classList.toggle('open');

                    // close sibling menus at the same level
                    Array.from(parentLi.parentElement.children).forEach(sib => {
                        if (sib !== parentLi) sib.classList.remove('open');
                    });
                }
            });
        });

        // Close the mobile menu when a leaf link (no submenu) is tapped
        document.querySelectorAll('.dropdown-menu a').forEach(link => {
            link.addEventListener('click', function () {
                if (!this.parentElement.classList.contains('dropdown-parent')) {
                    menu.classList.remove('open');
                    navToggle.classList.remove('open');
                    navToggle.setAttribute('aria-expanded', false);
                }
            });
        });
    </script>
</body>
</html>

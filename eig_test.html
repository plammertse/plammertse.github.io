   // Test this on Etkin's B747.

              [  -0.09055,   -0.3151,    773.98,    0    ],

// GEMINI EXAMPLE ////////////////////////////////////////////////////////
console.log( 'Gemini example');

const AA = math.matrix([
  [5, 2.3],
  [3,  1]
//  [2.3, 1]
]);

// 1. Compute the eigenvalues and eigenvectors
const result = math.eigs(AA);

console.log( '   -- first eigenvalue, one way, "direct"');
console.log( result.values._data[0] );
console.log( '   -- first eigenvalue, second way, via "eigenvectors"');
console.log( result.eigenvectors[0].value );
console.log( '   -- first eigenvector');
console.log( result.eigenvectors[0].vector );
console.log( '   -- second eigenvector');
console.log( result.eigenvectors[1].vector );


// 2. Access the array of eigenvectors (instead of .vectors)
const eigenvectorsArray = result.eigenvectors; 
// This returns: [{ value: E1, vector: [...] }, { value: E2, vector: [...] }]

console.log( '   -- Build the matrix with the eigenvectors as columns');
console.log( '   -- via map( input => input.vector )');
console.log( '   -- ( called inside matrixFromColumns() )');

// 3. Rebuild the single combined matrix using math.matrixFromColumns
// Pass each vector from the array into the columns utility
const eigenvectorMatrix = math.matrixFromColumns(
  ...eigenvectorsArray.map( input => input.vector)
);
const eigenvectorsArray2 = eigenvectorsArray.map( input => input.vector)
const eigenvectorMatrix2 = math.matrixFromColumns(
                           ...eigenvectorsArray2);

console.log(eigenvectorMatrix.toString());
console.log(eigenvectorMatrix2.toString());

// Output: [[-0.41462..., 0.91000...], [0.91000..., 0.41462...]]
//////////////////////////////////////////////////////////////////////////

/*
   const E   = ans.values;

   // Eigenvectors is an array of objects with the properties : {value, vector}.
   // Pick out the first of these objects, and from that its property "vector".
   let V0 = V[0].vector;
   // Normalize the first eigenvector to theta ( == real 1 ).
   //    Note that the q element is almost exactly the eigenvalue,
   //    I think because q is the derivative of theta,
   //    like the amplitude of a rotation rate is the frequency
   //    (eigenvalue) omega times the amplitude of the rotation angle,
   //    in an underdamped pendulum. *With* damping it's not 90 degrees.
   V0 = math.dotDivide( V0, V0[3]);
   console.log('  -- first eigenvector :', V0);
   
   let TAS = 774;   // airspeed, the letter V is taken
   let mac = 27.31;
   let u_hat = math.divide(V0[0],TAS);
   console.log('^u : ', u_hat);
   let alpha = math.divide(V0[1],TAS);
   console.log('alpha : ', alpha);
   // PL-25-087 about Etkin : ^q == qc/2V
//   let q_hat = math.divide(V0[2],2*S/mac);
   let q_hat = math.multiply(V0[2], mac/2/TAS);
   console.log('^q :', q_hat);
